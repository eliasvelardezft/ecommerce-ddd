runtime: python39
entrypoint: make start

instance_class: F2

handlers:
  - url: /static
    static_dir: static/
    secure: always

  - url: /.*
    script: auto
    secure: always

env_variables:
  # Add your environment variables here
  # DATABASE_URL: 'postgresql://username:password@host:port/database'
  # SECRET_KEY: 'your-secret-key'
  ENVIRONMENT: 'production'

automatic_scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.65
