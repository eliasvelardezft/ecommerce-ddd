repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: poetry run ruff check
        language: system
        types: [python]
        
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        args: [src, --ignore-missing-imports]
        pass_filenames: false  # mypy works better when run on the whole project
