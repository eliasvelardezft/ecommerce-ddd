services:
  app:
    container_name: ecommerce
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DEV=true
    ports:
      - "8008:8008"
    volumes:
      - ./src:/src  # Mount src for live reload in development
      - ./db:/db    # Mount local db directory for SQLite persistence (legacy)
    env_file:
      - ./.env
    depends_on:
      postgres:
        # condition: service_healthy
        condition: service_started
      mongo:
        condition: service_started
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8008

  postgres:
    container_name: ecommerce-postgres
    image: postgres:15-alpine
    ports:
      - "5432:5432" # Expose PostgreSQL to the host for direct access
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_ddd"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 30s

  mongo:
    container_name: ecommerce-mongo
    image: mongo:latest # Or a specific version like mongo:5.0
    ports:
      - "27017:27017" # Expose MongoDB to the host for direct access if needed
    volumes:
      - mongo_data:/data/db # Persist MongoDB data
    environment:
      - MONGO_INITDB_DATABASE=ecommerce # Optional: create a database on init
    # You can add MONGO_INITDB_ROOT_USERNAME and MONGO_INITDB_ROOT_PASSWORD here
    # if your application requires immediate authentication to MongoDB.
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=root
    #   - MONGO_INITDB_ROOT_PASSWORD=example

volumes:
  postgres_data: # PostgreSQL data persistence
  mongo_data: # Defines the named volume for MongoDB data
  # app_db_data: # If you were using a named volume for SQLite instead of host mount 