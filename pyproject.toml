[tool.poetry]
name = "ecommerce-ddd"
version = "0.1.0"
description = "E-commerce application using DDD, CQRS, and Event Sourcing"
authors = [
    "Elias Velardez <eliasvelardez38@gmail.com>"
]
readme = "README.md"
packages = [{include = "src"}]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.12"
uvicorn = {extras = ["standard"], version = "^0.34.2"}
pydantic = "^2.11.5"
pydantic-settings = "^2.9.1"
aiosqlite = "^0.21.0"
pymongo = "^4.13.0"
python-dotenv = "^1.1.0"
httpx = "^0.28.0"
rich = "^14.0.0"
colorlog = "^6.9.0"
sqlalchemy = "^2.0.41"
motor = "^3.7.1"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
alembic = "^1.16.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^1.0.0"
ruff = "^0.11.11"
mypy = "^1.15.0"
ipdb = "^0.13.13"
pytest-cov = "^6.2.1"
mongomock-motor = "^0.0.36"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--asyncio-mode=auto",
    "-v"
]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py313"
line-length = 100  # Code line length
src = ["src"]  # Tell ruff where source code is located
exclude = [
    "src/infrastructure/core/persistence/alembic/env.py",
    "src/infrastructure/core/persistence/alembic/versions/*.py",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120  # Docstrings and comments can be longer

[tool.ruff.lint]
# Focus on essential rules: syntax errors, imports, basic style
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings  
    "F",    # pyflakes (syntax errors, undefined names)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
]
ignore = [
    "E402",  # Module level import not at top of file (common in DDD structure)
    "F821",  # Undefined name (for SQLAlchemy string type annotations)
    "E501",  # Rely on ruff formatter to handle line length 
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api" 
