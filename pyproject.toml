[tool.poetry]
name = "ecommerce-ddd"
version = "0.1.0"
description = "E-commerce application using DDD, CQRS, and Event Sourcing"
authors = [
    "Elias Velardez <eliasvelardez38@gmail.com>"
]
readme = "README.md"
packages = [{include = "src"}]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.12"
uvicorn = {extras = ["standard"], version = "^0.34.2"}
pydantic = "^2.11.5"
pydantic-settings = "^2.9.1"
aiosqlite = "^0.21.0"
pymongo = "^4.13.0"
python-dotenv = "^1.1.0"
httpx = "^0.28.0"
rich = "^14.0.0"
colorlog = "^6.9.0"
sqlalchemy = "^2.0.41"
motor = "^3.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^1.0.0"
ruff = "^0.11.11"
mypy = "^1.15.0"
ipdb = "^0.13.13"

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api" 
